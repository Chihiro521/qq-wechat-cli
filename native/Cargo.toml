[package]
name = "qq-wechat-engine"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
md-5 = "0.10"
hex = "0.4"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
roxmltree = "0.21"
fs2 = "0.4"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
 "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Memory",
 "Win32_System_Threading", "Win32_System_Diagnostics_Debug",
 "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Cryptography",
 "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_ProcessStatus"
] }

[profile.release]
lto = "thin"
strip = true
